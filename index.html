<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAISCHE – Solana Meme Coin Bot</title>
<style>
:root{color-scheme:dark;--bg:#0a0c18;--side:#0d1021;--card:#11152a;--card2:#161b34;--line:#222844;--fg:#eaecf6;--mut:#8a92b2;--acc:#6d5efc;--acc2:#9a8cff;--ok:#33d17a;--warn:#f5a524;--bad:#ff5c72;--info:#4aa3ff;--r:12px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--acc2)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 6px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#3a8bff);display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:19px;letter-spacing:.5px}.brand span{color:var(--mut);font-size:12px}
nav.menu{display:flex;flex-direction:column;gap:4px}
nav.menu button{display:flex;gap:12px;align-items:center;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--mut);cursor:pointer;text-align:left}
nav.menu button:hover{background:var(--card)}
nav.menu button.on{background:#1b1f45;color:var(--fg)}
nav.menu svg,.ico{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.box h4{margin:0 0 8px;font-size:13px}
.st{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px;background:var(--mut)}
.st i.ok{background:var(--ok)}.st i.bad{background:var(--bad)}
.st .ok{color:var(--ok)}.st .bad{color:var(--bad)}.st .mut{color:var(--mut)}
.main{min-width:0;padding:18px 22px 70px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.top h1{margin:0;font-size:26px;display:inline}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:8px;font-size:12px;border:1px solid var(--ok);color:var(--ok);margin-left:10px;vertical-align:middle}
.pill.off{border-color:var(--bad);color:var(--bad)}
.sub{color:var(--mut);margin:4px 0 0}
.tools{display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex:1;min-width:280px;max-width:640px}
.trow{display:flex;gap:10px;width:100%;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0;min-width:0}
.bell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--bad);border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes button,.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer}
.modes button.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:hover{border-color:var(--acc2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.kpi{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:26px;height:26px}
.kpi small{color:var(--mut);display:block}.kpi .v{font-size:28px;font-weight:700}.kpi .d{font-size:12px;color:var(--mut)}
.kpi .up{color:var(--ok);font-size:12px;margin-left:8px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px}
.grid3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 380px;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{margin:0;font-size:19px}.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}

.sel{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:8px 8px}
td{padding:9px 8px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td{background:rgba(109,94,252,.07)}tr.sel td{background:rgba(109,94,252,.13)}
.tk{display:flex;gap:10px;align-items:center}
.av{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card2)}
.tk b{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis}.tk span{color:var(--mut);font-size:12px}
.tag{display:inline-block;min-width:48px;text-align:center;padding:2px 8px;border-radius:6px;border:1px solid;font-size:12px;font-weight:600}

.g{color:var(--ok)}.r{color:var(--bad)}.y{color:var(--warn)}.m{color:var(--mut)}
.feed{display:flex;flex-direction:column;gap:2px}
.fi{display:grid;grid-template-columns:42px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi time{color:var(--mut);font-size:12px}

.thead{display:flex;gap:12px;align-items:center;margin-bottom:10px}

.addr{font-size:12px;color:var(--mut);word-break:break-all}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
canvas{width:100%;height:230px;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-bottom:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.note{border:1px solid var(--warn);background:rgba(245,165,36,.08);border-radius:10px;padding:10px 14px;font-size:13px}
.note.info{border-color:var(--info);background:rgba(74,163,255,.08)}
.note.bad{border-color:var(--bad);background:rgba(255,92,114,.08)}
.foot{position:fixed;left:236px;right:0;bottom:0;background:var(--side);border-top:1px solid var(--line);padding:9px 22px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.form{display:grid;gap:12px;max-width:560px}
.form label{display:grid;gap:5px;color:var(--mut);font-size:13px}

.modal{position:fixed;inset:0;background:rgba(3,4,12,.72);place-items:center;padding:16px;z-index:50}
.modal:not([hidden]){display:grid}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto;background:var(--card2)}
.empty{color:var(--mut);padding:26px 8px;text-align:center}
.spark{vertical-align:middle;margin-left:8px}
.stars{cursor:pointer;color:var(--mut);background:none;border:0;font-size:17px;padding:0 4px}.stars.on{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:7px;border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(51,209,122,.5);background:rgba(51,209,122,.07)}
.chip.bad{color:var(--bad);border-color:rgba(255,92,114,.5);background:rgba(255,92,114,.07)}
.chip.mut{color:var(--mut)}.chip.warn{color:var(--warn);border-color:rgba(245,165,36,.5);background:rgba(245,165,36,.07)}
.setupgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.sc.hit{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.toasts{position:fixed;top:12px;right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 24px))}
.toast{background:var(--card2);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}
@media(max-width:1300px){.grid3{grid-template-columns:minmax(0,1fr) 380px}.grid3>.card:nth-child(2){grid-column:1}}

 .side .box,.brand span{display:none}
 nav.menu{flex-direction:row;overflow-x:auto;max-width:100%}
 nav.menu button{padding:8px 10px;white-space:nowrap}

}

:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

<script>
"use strict";
/* ============ Helfer ============ */
const $ = (s, r = document) => r.querySelector(s);
const MIN = 60000;
const store = {
  get(k, d) { try { const v = localStorage.getItem("scout_" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("scout_" + k, JSON.stringify(v)); } catch {} },
};
/* Alle fremden Texte (Namen, Symbole) werden ausschließlich als Textknoten eingefügt. */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat(2)) if (kid != null && kid !== false) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const usd = (v) => v == null ? "–" : v >= 1e9 ? "$" + (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M" : v >= 1e4 ? "$" + (v / 1e3).toFixed(0) + "K" : v >= 1e3 ? "$" + (v / 1e3).toFixed(1) + "K" : v >= 1 ? "$" + v.toFixed(0) : "$" + Number(v).toPrecision(2);
const num = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("de-DE", { maximumFractionDigits: d });
const pct = (v, d = 0) => v == null ? "–" : (v >= 0 ? "+" : "") + Number(v).toFixed(d).replace(".", ",") + "%";
const ageTxt = (min) => min == null ? "–" : min < 60 ? Math.max(1, Math.round(min)) + "m" : min < 1440 ? Math.round(min / 60) + "h" : Math.round(min / 1440) + "d";
const short = (a) => a ? a.slice(0, 4) + "…" + a.slice(-4) : "";

  const best = new Map();
  for (const p of pairs || []) {
    if (p.chainId && p.chainId !== "solana") continue;
    const n = norm(p); if (!n.mint) continue;
    const c = best.get(n.mint); if (!c || (n.liq || 0) > (c.liq || 0)) best.set(n.mint, n);
  }
  const now = Date.now();
  for (const [m, n] of best) {
    let tk = S.tokens.get(m);
    const ageH = n.created ? (now / 1000 - n.created) / 3600 : null;
    if (!tk) {
      if (!keep && (ageH == null || ageH > S.maxAgeH)) continue;
      tk = newTk(m); tk.keep = keep; S.tokens.set(m, tk);
      if (!keep && (n.liq || 0) >= 5000 && ageH < 1) tk.announceNew = true;
    } else if (createOnly) continue;
    tk.prev = tk.s; tk.s = n; tk.dexOk = true;

}
